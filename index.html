
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Junkie Beach Events</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #17100b;
  color: #f4deb0;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 18px 12px 12px;
  background: #382213;
  border-bottom: 3px solid #bd8739;
}
h1 {
  margin: 0;
  color: #ffd78a;
  font-size: 38px;
  letter-spacing: 3px;
}
.subtitle {
  margin-top: 7px;
  font-size: 17px;
}
h2 {
  margin: 12px 0;
  text-align: center;
  color: #ffd78a;
  font-size: 25px;
}
#status {
  text-align: center;
  padding: 8px;
  color: #bda982;
  font-size: 13px;
}
.day {
  margin: 7px 15px;
  border: 1px solid #73532c;
  background: #281b11;
}
.day-title {
  padding: 8px 12px;
  background: #4c301b;
  color: #ffd78a;
  font-size: 19px;
  font-weight: bold;
}
.event {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 10px;
  padding: 8px 12px;
  border-top: 1px solid #5d432b;
  font-size: 17px;
}
.time {
  color: #f7c96b;
  font-weight: bold;
}
.genre {
  color: #c7b99f;
  font-size: 14px;
  margin-top: 3px;
}
.empty {
  padding: 8px 12px;
  color: #9b8a72;
  font-style: italic;
}
footer {
  text-align: center;
  padding: 12px;
  color: #d6b879;
  font-style: italic;
}
</style>
</head>
<body>

<header>
  <h1>MUSIC JUNKIE BEACH</h1>
  <div class="subtitle">Different Genres, One Love Music</div>
</header>

<h2>WEEKLY EVENTS</h2>
<div id="status"></div>
<main id="schedule"></main>
<footer>All times in SLT</footer>

<script>
const days = [
  "Monday", "Tuesday", "Wednesday",
  "Thursday", "Friday", "Saturday", "Sunday"
];

function formatTime(minutes) {
  const hour24 = Math.floor(minutes / 60);
  const minute = minutes % 60;
  const hour12 = hour24 % 12 || 12;
  const suffix = hour24 >= 12 ? "PM" : "AM";
  return hour12 + "." +
    String(minute).padStart(2, "0") + " " + suffix;
}

function render(events) {
  const schedule = document.getElementById("schedule");
  schedule.replaceChildren();

  for (let day = 0; day < 7; day++) {
    const section = document.createElement("section");
    section.className = "day";

    const heading = document.createElement("div");
    heading.className = "day-title";
    heading.textContent = days[day];
    section.appendChild(heading);

    const entries = events
      .filter(e => Number(e.day) === day)
      .sort((a, b) => Number(a.start) - Number(b.start));

    if (!entries.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No events scheduled";
      section.appendChild(empty);
    }

    for (const event of entries) {
      const row = document.createElement("div");
      row.className = "event";

      const time = document.createElement("div");
      time.className = "time";
      time.textContent =
        formatTime(Number(event.start)) + " - " +
        formatTime(Number(event.end));

      const details = document.createElement("div");
      const name = document.createElement("strong");
      name.textContent = event.artist || "";

      const genre = document.createElement("div");
      genre.className = "genre";
      genre.textContent = event.genre || "";

      details.append(name, genre);
      row.append(time, details);
      section.appendChild(row);
    }

    schedule.appendChild(section);
  }
}

async function update() {
  try {
    const response = await fetch(
      "events.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("No event data");

    const events = await response.json();
    if (!Array.isArray(events)) throw new Error("Invalid data");

    render(events);
    document.getElementById("status").textContent = "";
  } catch (error) {
    render([]);
    document.getElementById("status").textContent =
      "Waiting for event data";
  }
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
